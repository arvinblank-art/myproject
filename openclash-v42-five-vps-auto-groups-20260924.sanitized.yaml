---
proxy-providers:
  duck:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: 'duck | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
  ykk:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: 'ykk | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
proxies:
- name: 自建香港 Yecaoyun Reality
  type: vless
  server: "<YECAOYUN_DOMAIN>"
  port: 443
  uuid: "<REDACTED_UUID>"
  network: tcp
  udp: true
  tls: true
  servername: "<REALITY_SNI>"
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  reality-opts:
    public-key: "<REDACTED_PUBLIC_KEY>"
    short-id: "<REDACTED_SHORT_ID>"
- name: 自建日本 Yecaoyun -> Evoxt
  type: vless
  server: "<YECAOYUN_DOMAIN>"
  port: 443
  uuid: "<REDACTED_UUID>"
  network: tcp
  udp: true
  tls: true
  servername: "<REALITY_SNI>"
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  reality-opts:
    public-key: "<REDACTED_PUBLIC_KEY>"
    short-id: "<REDACTED_SHORT_ID>"
- name: 自建日本 Yecaoyun -> VMISS
  type: vless
  server: "<YECAOYUN_DOMAIN>"
  port: 443
  uuid: "<REDACTED_UUID>"
  network: tcp
  udp: true
  tls: true
  servername: "<REALITY_SNI>"
  client-fingerprint: chrome
  flow: xtls-rprx-vision
  reality-opts:
    public-key: "<REDACTED_PUBLIC_KEY>"
    short-id: "<REDACTED_SHORT_ID>"
- name: 自建香港 Yecaoyun HY2
  type: hysteria2
  server: "<YECAOYUN_DOMAIN>"
  port: 443
  password: "<REDACTED_PASSWORD>"
  obfs: salamander
  obfs-password: "<REDACTED_OBFS_PASSWORD>"
  sni: "<YECAOYUN_DOMAIN>"
  skip-cert-verify: false
- name: Akile HiNet AnyTLS
  type: anytls
  server: "<REDACTED_NODE_ENDPOINT>"
  port: 22392
  password: "<DERIVED_FROM_AKILE_HY2_PASSWORD>"
  tls: true
  servername: "<REDACTED_NODE_ENDPOINT>"
  client-fingerprint: chrome
- name: Evoxt Osaka to Akile Taiwan AnyTLS
  type: anytls
  server: "<EVOXT_SERVER_IP>"
  port: 2054
  password: "<REDACTED_PASSWORD>"
  tls: true
  servername: "<REDACTED_NODE_SNI>"
  client-fingerprint: chrome
