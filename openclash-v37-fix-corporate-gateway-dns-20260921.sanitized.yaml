# v37: preserve v36 and document a router-only corporate-gateway DNS exception.
# The private deployment excludes the verified gateway from Fake-IP and applies
# the matching private direct-IP exception without disclosing corporate details.
# v27: Add Evoxt Osaka to Akile Taiwan AnyTLS relay on TCP 2054; credentials remain private.
# Preserve v23 routing, policy groups, and all subscription semantics.
# Private nodes, endpoint aliases, and authentication parameters are intentionally omitted.
proxy-providers:
  duck:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: 'duck | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
  Sky:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: 'Sky | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
  ykk:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: 'ykk | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
  机场4:
    url: "<REDACTED_URL>"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: "<REDACTED_URL>"
      interval: 600
      lazy: true
      timeout: 5000
      expected-status: 204
    proxy: 直连
    override:
      additional-prefix: '机场4 | '
    exclude-filter: "(?i)剩余|流量|套餐|到期|官网|客服|群组|通知|重置"
