# v47: Keep the Yecaoyun to Akile Taiwan relay; remove Panstar and VMISS groups and nodes.
# v24: Keep the approved routing profile; private node endpoint aliases are delivered through the private subscription.
# Private node endpoints and authentication parameters remain outside Git.
# v12: Preserve the self-hosted Reality endpoint with a leading private IP-CIDR DIRECT rule.
# The endpoint and credentials are omitted from this public profile.
# v11: Add the Osaka Reality node privately; credentials remain outside Git.
# Existing Japan and self-hosted selectors match its private node name.
# Add the same subscription separately in Shadowrocket; no subscription URL is embedded.
# v8: Remove the retired subscription from the private provider inventory.
# Retain all remaining subscriptions, self-hosted nodes and routing policies.
# v7: Retire the selected VMess WebSocket TLS, Hysteria2 and TUIC self-hosted nodes.
