# Sanitized OpenClash/Mihomo routing baseline.
# Proxy providers, server endpoints, UUIDs, passwords, and update URLs are intentionally excluded.
# Add node credentials only on the router; do not commit them to Git.
proxies: []

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
    - https://dns.google/dns-query#RULES
    - https://cloudflare-dns.com/dns-query#RULES
  nameserver-policy:
    "rule-set:private_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:cn_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "rule-set:geolocation-!cn":
      - https://dns.google/dns-query#RULES
      - https://cloudflare-dns.com/dns-query#RULES
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
    - "resolvers.httpdns.aliyuncs.com"
    - "+.httpdns.aliyuncs.com"

# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇹🇼 台湾节点, 🇺🇲 美国节点, 直连]}

  - {name: 💰 虚拟货币, type: select, proxies: [♻️ 台湾自动, 🇹🇼 台湾节点]}
  - {name: 🤖 ChatGPT, type: select, proxies: [♻️ 日本自动, 🇯🇵 日本节点, ♻️ 美国自动, 🇺🇲 美国节点]}
  - {name: 🎥 NETFLIX, type: select, proxies: [♻️ 香港自动, 🇭🇰 香港节点]}
  - {name: 📹 YouTube, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, 🚀 默认代理, 直连]}
  - {name: 🍀 Google, type: select, proxies: [♻️ 香港自动, ♻️ 日本自动, 🚀 默认代理, 直连]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [♻️ 日本自动, ♻️ 香港自动, 🚀 默认代理, 直连]}
  - {name: 🐬 OneDrive, type: select, proxies: [直连, 🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动]}
  - {name: 🪟 Microsoft, type: select, proxies: [直连, 🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动]}
  - {name: 🎵 TikTok, type: select, proxies: [♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, 🚀 默认代理, 直连]}
  - {name: 📲 Telegram, type: select, proxies: [♻️ 狮城自动, ♻️ 香港自动, ♻️ 日本自动, 🚀 默认代理, 直连]}
  - {name: 💶 PayPal, type: select, proxies: [🇯🇵 日本节点, ♻️ 日本自动]}
  # Interactive Brokers / IBKR：默认固定美国节点，保留美国自动作故障备用。
  - {name: 💹 IBKR, type: select, proxies: [🇺🇲 美国节点, ♻️ 美国自动]}
  # 香港银行及常用香港 App：银行登录期间优先固定节点，避免自动切换出口 IP。
  - {name: 🏦 香港服务, type: select, proxies: [🇭🇰 香港节点, ♻️ 香港自动, 直连]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, ♻️ 香港自动, ♻️ 日本自动, ♻️ 狮城自动, ♻️ 美国自动, ♻️ 自动选择, 直连]}

  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", exclude-filter: "cheap \\| 🇯🇵日本东京0[1-5]"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$"}
  - {name: 🇹🇼 台湾节点, type: select, include-all: true, filter: "(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🇺🇲 美国节点, type: select, include-all: true, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$"}

  - {name: ♻️ 香港自动, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"}
  - {name: ♻️ 日本自动, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", exclude-filter: "cheap \\| 🇯🇵日本东京0[1-5]"}
  - {name: ♻️ 狮城自动, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$"}
  - {name: ♻️ 台湾自动, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美)).)*$"}
  - {name: ♻️ 美国自动, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, url: https://www.gstatic.com/generate_204, expected-status: 204, tolerance: 50, interval: 600, timeout: 5000, max-failed-times: 3, lazy: true, filter: "^((?!(直连)).)*$"}
  - {name: 🌐 全部节点, type: select, include-all: true, hidden: true}


