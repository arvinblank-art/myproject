allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  skip-dst-address:
  - <PANSTAR_SERVER_IP>/32
  - 38.47.98.65/32
  - <EVOXT_SERVER_IP>/32
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - "+.push.apple.com"
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.19.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
  - https://dns.google/dns-query#RULES
  - https://cloudflare-dns.com/dns-query#RULES
  nameserver-policy:
    rule-set:private_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:cn_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    rule-set:geolocation-!cn:
    - https://dns.google/dns-query#RULES
    - https://cloudflare-dns.com/dns-query#RULES
  fake-ip-filter:
  - rule-set:fakeipfilter_domain
  - resolvers.httpdns.aliyuncs.com
  - "+.httpdns.aliyuncs.com"
